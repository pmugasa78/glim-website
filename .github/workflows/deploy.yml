# Checks every push and pull request; deploys main to Cloudflare Workers.
#
# Repository secret (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  Account token with Workers Scripts: Edit and D1: Edit
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time, in order.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Add CLOUDFLARE_API_TOKEN to the repository secrets to deploy."
            exit 0
          fi
          npx wrangler d1 migrations apply glim-beta --remote
          npx wrangler deploy
