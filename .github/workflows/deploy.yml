# Checks every push and pull request; deploys main to Cloudflare Workers.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  Account token with Workers Scripts: Edit and D1: Edit
#   TURNSTILE_SECRET      Secret key of the "Glim website" Turnstile widget
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time, in order.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$TURNSTILE_SECRET" ]; then
            echo "::warning::Add CLOUDFLARE_API_TOKEN and TURNSTILE_SECRET to the repository secrets to deploy."
            exit 0
          fi
          # Secrets go up with the deploy, from a file that never leaves the runner.
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify({ TURNSTILE_SECRET: process.env.TURNSTILE_SECRET }))'
          npx wrangler d1 migrations apply glim-beta --remote
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
